    name: "Kim Cương"
  EMERALD:
    multiplier: 2.0
    name: "Lục Bảo"
  GOLD_INGOT:
    multiplier: 2.0
    name: "Thỏi Vàng"
  IRON_INGOT:
    multiplier: 2.0
    name: "Thỏi Sắt"
  COPPER_INGOT:
    multiplier: 2.0
    name: "Thỏi Đồng"
  AMETHYST_SHARD:
    multiplier: 2.0
    name: "Mảnh Thạch Anh"
  LAPIS_LAZULI:
    multiplier: 2.0
    name: "Đá Lam Ngọc"
  REDSTONE:
    multiplier: 2.0
    name: "Đá Đỏ"
  QUARTZ:
