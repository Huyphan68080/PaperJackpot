  COAL:
    multiplier: 2.0
    name: "Than Đá"
  ECHO_SHARD:
    multiplier: 2.0
    name: "Mảnh Định Âm"

# ============================================
# Thông báo hiển thị cho người chơi trong CHAT (MiniMessage format)
# Các biến hỗ trợ: {start}, {end}, {pool}, {player}, {amount}, {bet}, {gross}, {tax}, {net}
# ============================================
messages:
  no-permission: "<red>❌ Bạn không có quyền sử dụng lệnh này!</red>"
  reload-success: "<green>✅ Đã reload cấu hình PaperJackpot thành công!</green>"
  not-enough-money: "<red>❌ Bạn không đủ tiền! Cần tối thiểu {amount}$ để quay lượt này.</red>"
  welcome-dealer: "<gradient:gold:yellow><bold>🤖 [CASINO DEALER]</bold></gradient> <yellow>Kính chúc <gold><bold>Ông Chủ / Bà Chủ {player}</bold></gold> quay hũ phát tài, may mắn phát lộc và trúng đại lễ Jackpot! 🎉</yellow>"
  win: "<green>🎉 TRÚNG! 3x {item} (x2.0) | Cược: {bet}$ → Thưởng: {gross}$ - Thuế (10%): {tax}$ = Nhận thực tế: {net}$</green>"
  lose: "<red>❌ Không trúng! Mất {amount}$ cược. (Tiền thua đã nạp 100% vào Quỹ Jackpot Server)</red>"
  jackpot-win: "<gradient:#FF0000:#FFD700><bold>🔥 JACKPOT NỔ HŨ X5 + QUỸ JACKPOT! Cược: {bet}$ → Nhận: {gross}$ - Thuế (10%): {tax}$ = Nhận thực tế: {net}$ 🔥</bold></gradient>"

  # Thông báo Sự Kiện Giờ Vàng Casino qua Chat (Múi giờ Việt Nam UTC+7)
  happy-hour-start: |
    
    <gradient:#FFD700:#FF4500><bold>🎆 [CASINO] SỰ KIỆN GIỜ VÀNG ĐÃ BẮT ĐẦU! 🎆</bold></gradient>
    <yellow>⏰ Khung giờ vàng từ <gold><bold>{start}:00</bold></gold> đến <gold><bold>{end}:00</bold></gold> (Giờ Việt Nam UTC+7)!</yellow>
    <yellow>🔥 Quỹ Jackpot hiện tại: <gold><bold>{pool}$</bold></gold> | Nhận ngay <gradient:#FF0000:#FFD700><bold>X2 TỶ LỆ NỔ HŨ JACKPOT</bold></gradient>!</yellow>
    <yellow>👉 Nhanh tay gõ <gold><bold>/jackpot</bold></gold> để hốt trọn Quỹ Jackpot ngay kẻo lỡ!</yellow>
    

  happy-hour-end: |
    
    <gradient:#FF4500:#FFD700><bold>⏰ [CASINO] SỰ KIỆN GIỜ VÀNG ĐÃ KẾT THÚC! ⏰</bold></gradient>
    <yellow>Khung giờ vàng Nổ Hũ hôm nay đã chính thức khép lại. Cảm ơn các Đại Gia đã tham gia!</yellow>
    <yellow>🎉 Hẹn gặp lại các chủ hũ vào <gold><bold>{start}:00 ngày mai</bold></gold> nhé!</yellow>
    
