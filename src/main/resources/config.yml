# ============================================
# PaperJackpot - Cấu hình Plugin Quay Hũ Nổ Hũ
# ============================================

settings:
  # Mức cược tối thiểu và tối đa ($)
  min-bet-amount: 1000.0
  max-bet-amount: 500000.0

  # Thuế suất trên tiền thưởng (0.10 = 10% thuế)
  tax-rate: 0.10

  # Hệ số thưởng: Tất cả khoáng sản thắng thường là x2.0, Nổ Hũ Jackpot là x5.0 + Quỹ Jackpot
  normal-win-multiplier: 2.0
  jackpot-multiplier: 5.0

  # Tiêu đề giao diện GUI Quay Hũ (Màu Đỏ Đô Đậm #8B0000 tương phản sắc nét trên nền xám GUI)
  gui-title: "<gradient:#8B0000:#D2143A><bold>🎰 CASINO NỔ HŨ</bold></gradient>"

  # Hiển thị BossBar Quỹ Jackpot Tích Lũy toàn server cho mọi người chơi online
  global-bossbar: true

  # Thưởng Đua Top Thần Tài hằng tuần (Tự động trao thưởng vào 23:59 Chủ Nhật theo giờ Việt Nam)
  weekly-rewards:
    enabled: true
    top1-reward: 500000.0
    top2-reward: 250000.0
    top3-reward: 100000.0

  # Sự Kiện Giờ Vàng Casino (Tự động nhân đôi tỷ lệ Nổ Hũ theo múi giờ Việt Nam 20:00 - 21:00)
  happy-hour:
    enabled: true
    timezone: "Asia/Ho_Chi_Minh" # Múi giờ Việt Nam (UTC+7) - Hoạt động chuẩn dù Server đặt tại Singapore / Châu Âu / Mỹ
    start-hour: 20
    end-hour: 21

  # Thưởng Chuỗi Quay May Mắn (Quay đủ 10 ván được 1 lượt x2 tỷ lệ trúng)
  streak-bonus:
    enabled: true
    required-spins: 10

# ============================================
# Biểu tượng Slot Machine
# ============================================
